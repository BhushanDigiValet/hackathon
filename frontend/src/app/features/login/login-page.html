<div class="mx-auto max-w-[430px] min-h-dvh flex flex-col pt-safe pb-safe bg-surface text-on-surface">
  <section
    class="relative overflow-hidden flex-1 flex flex-col justify-center px-margin-mobile py-12 bg-gradient-to-b from-surface-container-lowest via-surface to-surface-container-low"
  >
    <div class="absolute -top-12 -right-12 w-64 h-64 rounded-full bg-primary/10 blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-24 -left-10 w-48 h-48 rounded-full bg-secondary-container/20 blur-2xl pointer-events-none"></div>

    <div class="relative z-10 flex flex-col gap-8">
      <div class="flex flex-col gap-3">
        <span class="font-label-sm text-label-sm tracking-widest uppercase text-primary">Private concierge</span>
        <h1 class="font-display-md-mobile text-display-md-mobile text-on-surface">Welcome to Stay</h1>
        <p class="font-body-md text-body-md text-secondary max-w-xs">
          Enter the email on your reservation and we’ll prepare your stay.
        </p>
      </div>

      <form class="flex flex-col gap-4" novalidate (submit)="submit($event)">
        <label class="flex flex-col gap-2" for="login-email">
          <span class="font-title-md text-title-md text-on-surface">Email</span>
          <input
            id="login-email"
            type="email"
            autocomplete="email"
            inputmode="email"
            placeholder="you@example.com"
            class="h-[50px] px-4 rounded-lg bg-surface-container-high text-on-surface font-body-lg text-body-lg placeholder:text-outline border focus:outline-none focus:border-primary-container focus:shadow-[0_0_0_2px_rgba(201,164,92,0.15)] transition-colors"
            [class]="error() ? 'border-error' : 'border-on-surface/10'"
            [value]="email()"
            [attr.aria-invalid]="!!error()"
            [attr.aria-describedby]="error() ? 'login-error' : null"
            (input)="email.set($any($event.target).value); error.set(null)"
          />
        </label>

        @if (error(); as message) {
          <p id="login-error" class="font-label-lg text-label-lg text-error" role="alert">{{ message }}</p>
        }

        <button
          type="submit"
          class="w-full py-4 px-6 rounded-lg bg-primary hover:bg-primary-fixed text-on-primary font-title-lg text-title-lg flex items-center justify-center gap-2 shadow-xl transition-all active:scale-[0.99] disabled:opacity-80"
          [disabled]="submitting()"
        >
          @if (submitting()) {
            <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
            <span>Finding your stay...</span>
          } @else {
            <span>Continue</span>
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
          }
        </button>
      </form>

      <p class="text-center font-label-sm text-label-sm text-secondary">Discretion assured · Your details stay private</p>
    </div>
  </section>
</div>
